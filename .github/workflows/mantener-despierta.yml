name: Mantener despierta la API

on:
  schedule:
    - cron: '*/10 11-23 * * *'
    - cron: '*/10 0-4 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Visitar el endpoint de salud
        run: |
          URL="https://control-hogar.onrender.com/api/salud"
          for intento in 1 2 3; do
            codigo=$(curl -s -o /dev/null -w "%{http_code}" --max-time 240 "$URL") || codigo="000"
            echo "Intento $intento -> HTTP $codigo"
            if [ "$codigo" = "200" ]; then
              echo "API despierta y sana."
              exit 0
            fi
            echo "Aun no responde 200; espero 30 s y reintento..."
            sleep 30
          done
          echo "La API no respondio 200 tras los reintentos."
          exit 1
