# Configuracion del servicio en Render (Tema 10: despliegue)
# Las variables DB_* se completan en el panel de Render segun la base
# de datos elegida (ver la guia de despliegue en el README).
services:
  - type: web
    name: control-hogar
    runtime: docker
    branch: completar-silabo
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DRIVER
        sync: false
